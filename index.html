<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miss Studio Beauty | WhatsApp</title>
<meta name="theme-color" content="#f4cdd0">
<style>
:root {
  --pink:#d98e99;
  --pink-dark:#bd6f7b;
  --pink-light:#f7dfe0;
  --cream:#fff8f7;
  --gold:#c79a59;
  --text:#a85e69;
}
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; }
body {
  min-height:100vh;
  font-family: Georgia, "Times New Roman", serif;
  color:var(--text);
  background:
    radial-gradient(circle at 50% 35%, rgba(255,255,255,.75), transparent 38%),
    linear-gradient(145deg,#f8e7e5 0%,#f7d9da 48%,#f9e9e7 100%);
  overflow-x:hidden;
}
body:before, body:after {
  content:"";
  position:fixed;
  width:230px; height:230px;
  border-radius:50%;
  filter:blur(45px);
  opacity:.35;
  pointer-events:none;
}
body:before { left:-100px; top:80px; background:#e9a8b0; }
body:after { right:-100px; bottom:70px; background:#e8b8bd; }

.wrap {
  width:min(100%, 480px);
  min-height:100vh;
  margin:auto;
  padding:42px 24px 38px;
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
}

.logo {
  width:min(210px, 56vw);
  height:auto;
  display:block;
  object-fit:contain;
  mix-blend-mode:multiply;
  margin:5px auto 28px;
  filter:drop-shadow(0 7px 14px rgba(125,75,70,.08));
}

.essence {
  text-align:center;
  margin:0 0 16px;
  font-size:15px;
  letter-spacing:1.8px;
  font-style:italic;
  color:#b86d77;
}
.heading {
  text-align:center;
  margin:0 0 7px;
  font-size:19px;
  letter-spacing:5px;
  text-transform:uppercase;
  font-weight:400;
  color:#b86d77;
}
.script {
  text-align:center;
  margin:0 0 28px;
  font-size:34px;
  font-style:italic;
  font-weight:400;
  color:#c97884;
}

.buttons {
  width:100%;
  max-width:370px;
  display:flex;
  flex-direction:column;
  gap:17px;
}
.btn {
  min-height:76px;
  width:100%;
  border:1px solid rgba(199,154,89,.55);
  border-radius:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:16px;
  padding:12px 24px;
  text-decoration:none;
  color:white;
  background:linear-gradient(135deg,#df9aa3,#cf7f8a);
  box-shadow:0 10px 25px rgba(157,83,93,.18);
  transition:transform .15s ease, box-shadow .15s ease;
}
.btn:active { transform:scale(.98); }
.icon {
  width:40px; height:40px;
  border:2px solid rgba(255,255,255,.9);
  border-radius:50%;
  display:grid;
  place-items:center;
  font-family:Arial,sans-serif;
  font-size:22px;
}
.label {
  min-width:185px;
  text-align:left;
  line-height:1.08;
  letter-spacing:3px;
  font-size:17px;
}
.name { font-size:20px; letter-spacing:4px; }
.arrow { font-family:Arial,sans-serif; font-size:28px; opacity:.9; }

.footer {
  margin-top:38px;
  text-align:center;
  color:#bd7c84;
  letter-spacing:3px;
  font-size:11px;
}
.line { display:inline-block; width:65px; height:1px; background:#d39a9f; vertical-align:middle; margin:0 10px; }
.heart { color:#c98088; font-size:18px; vertical-align:middle; }

@media (max-height:700px) {
  .wrap { padding-top:25px; }
  .logo { width:175px; margin-bottom:18px; }
  .script { margin-bottom:18px; }
  .btn { min-height:64px; }
  .footer { margin-top:25px; }
}
</style>
</head>
