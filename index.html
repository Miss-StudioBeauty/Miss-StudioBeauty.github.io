<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miss Studio Beauty | Atendimento</title>
<meta name="theme-color" content="#f4cdd0">
<style>
:root {
  --pink:#d98e99;
  --pink-dark:#bd6f7b;
  --cream:#fff8f7;
  --gold:#c79a59;
  --text:#a85e69;
}
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; }
body {
  min-height:100vh;
  font-family: Georgia, "Times New Roman", serif;
  color:var(--text);
  background:
    radial-gradient(circle at 50% 35%, rgba(255,255,255,.78), transparent 38%),
    linear-gradient(145deg,#f8e7e5 0%,#f7d9da 48%,#f9e9e7 100%);
  overflow-x:hidden;
}
body:before, body:after {
  content:""; position:fixed; width:230px; height:230px; border-radius:50%;
  filter:blur(45px); opacity:.35; pointer-events:none;
}
body:before { left:-100px; top:80px; background:#e9a8b0; }
body:after { right:-100px; bottom:70px; background:#e8b8bd; }
.wrap {
  width:min(100%,480px); min-height:100vh; margin:auto; padding:32px 24px 38px;
  display:flex; flex-direction:column; align-items:center; position:relative;
}
.logo-circle {
  width:190px; height:190px; border-radius:50%; overflow:hidden; display:flex;
  align-items:center; justify-content:center; background:transparent;
  border:0;
  box-shadow:0 10px 28px rgba(125,75,70,.13);
  margin:0 auto 24px;
}
.logo { width:100%; height:100%; object-fit:contain; display:block; }
.heading { text-align:center; margin:0 0 6px; font-size:18px; letter-spacing:5px; text-transform:uppercase; font-weight:400; color:#b86d77; }
.script { text-align:center; margin:0 0 27px; font-size:33px; font-style:italic; font-weight:400; color:#c97884; }
.buttons { width:100%; max-width:370px; display:flex; flex-direction:column; gap:17px; }
.btn {
  min-height:76px; width:100%; border:1px solid rgba(199,154,89,.55); border-radius:42px;
  display:flex; align-items:center; justify-content:center; gap:16px; padding:12px 24px;
  text-decoration:none; color:white; background:linear-gradient(135deg,#df9aa3,#cf7f8a);
  box-shadow:0 10px 25px rgba(157,83,93,.18); transition:transform .15s ease,box-shadow .15s ease;
}
.btn:hover { transform:translateY(-1px); box-shadow:0 12px 28px rgba(157,83,93,.22); }
.btn:active { transform:scale(.98); }
.icon { width:40px; height:40px; border:2px solid rgba(255,255,255,.9); border-radius:50%; display:grid; place-items:center; flex:0 0 40px; }
.icon svg { width:22px; height:22px; display:block; fill:white; }
.label { min-width:185px; text-align:left; line-height:1.08; letter-spacing:3px; font-size:17px; }
.name { font-size:20px; letter-spacing:4px; }
.arrow { font-family:Arial,sans-serif; font-size:28px; opacity:.9; }
.footer { margin-top:38px; text-align:center; color:#bd7c84; letter-spacing:3px; font-size:11px; }
.line { display:inline-block; width:65px; height:1px; background:#d39a9f; vertical-align:middle; margin:0 10px; }
.heart { color:#c98088; font-size:18px; vertical-align:middle; }
@media (max-height:700px) {
  .wrap { padding-top:22px; } .logo-circle { width:155px; height:155px; margin-bottom:18px; }
  .script { margin-bottom:18px; } .btn { min-height:64px; } .footer { margin-top:25px; }
}
@media (max-width:360px) { .logo-circle { width:150px; height:150px; } .label { min-width:155px; } .name { font-size:18px; } }
</style>
</head>
